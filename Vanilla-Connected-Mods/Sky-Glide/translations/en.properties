bending.ability.skyglide.description=SkyGlide lets an airbender ride the wind in the direction they look, slowly and for a short time. It is a way to travel, not to fight, and it needs a long rest afterwards.
bending.ability.skyglide.instructions=Left click to start gliding. Look where you want to go. Sneak to land. It also ends on its own after a short while.
bending.ability.tideward.description=TideWard wraps a waterbender in a shell of water that soaks up damage and softens what gets through. It is Water's basic defense.
bending.ability.tideward.instructions=Left click to raise the ward. It fades after a few seconds and needs a rest before it can be raised again.
bending.ability.gills.description=Gills lets a waterbender breathe water and swim like a dolphin for a while.
bending.ability.gills.instructions=Left click to take on the sea's gift. It fades after a minute and a half.
bending.ability.cinderveil.description=CinderVeil wraps a firebender in embers so fire and lava cannot hurt them for a while.
bending.ability.cinderveil.instructions=Left click to put on the veil. It fades after a minute.
bending.ability.deepsight.description=DeepSight lets an earthbender feel the stone around them: they see in the dark and dig faster for a while.
bending.ability.deepsight.instructions=Left click to sense the earth. It fades after a minute and a half.
bending.ability.updraft.description=Updraft throws an airbender up on a column of wind, then lets them drift down gently.
bending.ability.updraft.instructions=Left click to leap on the wind in the direction you look.
