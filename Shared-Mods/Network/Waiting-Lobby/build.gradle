plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'com.silver'
version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Provided at runtime by the 'network-authorization' plugin (declared @Dependency), never shaded.
    compileOnly 'com.silver:authorization-common:0.1.0'
    compileOnly 'com.silver:network-authorization-velocity:0.1.0'
    testImplementation 'com.silver:authorization-common:0.1.0'
    testImplementation 'com.silver:network-authorization-velocity:0.1.0'
    // Provided at runtime by 'on-demand-servers' (declared @Dependency).
    compileOnly 'com.silver:on-demand-servers:0.1.0'
    testImplementation 'com.silver:on-demand-servers:0.1.0'
    // Provided at runtime by 'player-routing' (declared @Dependency): the Routing API lives only in that jar.
    compileOnly 'com.silver:player-routing:1.0.0'
    testImplementation 'com.silver:player-routing:1.0.0'
    compileOnly 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    testImplementation 'com.velocitypowered:velocity-api:3.4.0-SNAPSHOT'
    testImplementation 'org.slf4j:slf4j-api:2.0.13'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
    testImplementation 'org.mockito:mockito-core:5.18.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}

tasks.shadowJar {
    mergeServiceFiles()
    archiveBaseName.set('waiting-lobby')
    archiveClassifier.set('')
}

// Nothing is bundled, but keep the same layout as the other plugins: only the shadow jar is deployable.
tasks.jar {
    archiveClassifier.set('thin')
}

tasks.build {
    dependsOn tasks.shadowJar
}
