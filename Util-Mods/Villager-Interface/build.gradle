plugins {
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"villagerinterface" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly project(':network-authorization')
	compileOnly 'com.silver:authorization-common:0.1.0'
	// The Soulbound cap lookup lives in Soulbound-Items (build it first); every server with this mod has that one too.
	compileOnly files('../Soulbound-Items/build/libs/soulbound-items-1.0.0.jar')
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

test {
	useJUnitPlatform()
}

def modVersion = project.version

processResources {
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
