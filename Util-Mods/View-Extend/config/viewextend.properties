# View Extend v2. All players use equal throughput.
config-version=3
unsimulated-view-distance=127
max-chunks-per-player-per-tick=64
max-main-thread-prepared-chunks-per-tick=512
max-unloads-per-player-per-tick=2048
lod1-start-distance=128
lod1-top-non-air-sections=4
unload-buffer-chunks=2
unload-grace-ticks=20
pending-chunks-hard-limit=128
client-reported-view-distance-hard-cap=127
global-packet-template-cache-max-entries=65536
global-packet-template-cache-ttl-ticks=1200
global-packet-template-cache-max-mib=256
max-nbt-reads-per-tick=256
prepared-queue-hard-limit=1024
worker-threads=0
metrics-info-logs-enabled=true
metrics-log-interval-ticks=100
fallback-sky-light-level=15
fallback-block-light-level=0
ocean-fallback-enabled=false
ocean-fallback-sky-light-level=0
