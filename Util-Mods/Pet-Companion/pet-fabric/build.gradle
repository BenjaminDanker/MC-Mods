plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

base {
    archivesName = 'pet-companion'
}

loom {
    splitEnvironmentSourceSets()
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    mods {
        'pet_companion' {
            sourceSet sourceSets.main
        }
        'pet_companion_test' {
            sourceSet sourceSets.testmod
        }
    }

    runs {
        testmodServer {
            server()
            name 'Pet Companion Testmod Server'
            source sourceSets.testmod
        }
        gametest {
            inherit testmodServer
            name 'Pet Companion Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            if (providers.gradleProperty('gametestFilter').isPresent()) {
                vmArg "-Dfabric-api.gametest.filter=${providers.gradleProperty('gametestFilter').get()}"
            }
            runDir 'build/gametest'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly project(':network-authorization')
    compileOnly 'com.silver:authorization-common:0.1.0'

    implementation project(':pet-common')
    include project(':pet-common')

    // Shared permission API plus the separately-installable backend snapshot receiver.
    compileOnly 'com.silver:authorization-common:0.1.0'
    implementation project(':network-authorization')

    testmodImplementation sourceSets.main.output
    testmodImplementation project(':pet-service')

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.3'
    testImplementation project(':pet-service')
    testImplementation 'com.silver:authorization-common:0.1.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

tasks.named('runGametest') {
    outputs.file layout.buildDirectory.file('gametest-results.xml')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
