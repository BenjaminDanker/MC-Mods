pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'Element-Choice'

includeBuild('../../../Shared-Mods/Network/Network-Authorization')
include 'network-authorization'
project(':network-authorization').projectDir = file('../../../Shared-Mods/Network/Network-Authorization/fabric')

// Player Sync, built from source (it stores what these mods read and record)
include 'player-sync'
project(':player-sync').projectDir = file('../../../Shared-Mods/Network/Player-Sync')
