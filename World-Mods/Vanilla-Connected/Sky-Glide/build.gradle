plugins {
	id 'java'
}

version = '1.0.0'
group = 'com.silver'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

dependencies {
	// Bending and the libraries it nests, copied from the Bending mod jar into libs/ (not committed).
	compileOnly fileTree(dir: 'libs', include: '*.jar')
}

jar {
	archiveBaseName = 'sky-glide'
}
